[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "npframe"
version = "1.0.0"
description = "A production-grade, length-prefixed framed protocol over TCP (reference implementation)."
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["protocol", "framing", "tcp", "networking", "wire-format"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Intended Audience :: Developers",
]
dependencies = []

# This is a single-module reference library on purpose: it is meant to be read end to end
# and copied into a project, not pulled in as an opaque dependency.
[tool.setuptools]
py-modules = ["framed_protocol"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5", "hypothesis>=6", "cryptography>=42"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test_protocol.py"]

# Type-check the wire-handling code strictly; subtle Optional/None bugs there are exactly
# the kind that surface only against a real peer.
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
